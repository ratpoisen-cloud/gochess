<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoChess</title>
    <script>
      // __GOCHESS_BASE__ is substituted at build time from vite.config.ts `base`,
      // so this works for any deployment path instead of a hardcoded one.
      var base = '__GOCHESS_BASE__' || '/'
      if (base.charAt(base.length - 1) !== '/') base += '/'

      var path = window.location.pathname
      var search = window.location.search
      var hash = window.location.hash
      var root = base.replace(/\/$/, '')

      if (path !== base && path !== root) {
        sessionStorage.setItem('gochess-redirect', path + search + hash)
      }
      window.location.replace(base)
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
